name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          accept-android-sdk-licenses: true
          packages: ""

      - name: Komponenty Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Zależności
        run: npm install

      - name: Synchronizacja www -> android
        run: npx cap sync android

      - name: Ikony (jeśli Pillow jest dostępny)
        run: |
          if python3 -c "import PIL" 2>/dev/null; then
            python3 tools/make-icons.py
          else
            echo "Pillow niedostępny — zostają ikony z repozytorium"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ogulniega-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK jako release (tylko przy tagu)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
