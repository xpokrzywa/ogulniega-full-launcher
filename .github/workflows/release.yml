name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pakiety systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Zależności JS
        run: npm install

      - name: Budowa (deb + AppImage)
        run: npx tauri build --bundles deb,appimage

      - name: Artefakt desktop
        uses: actions/upload-artifact@v4
        with:
          name: ogulniega-mobile-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          accept-android-sdk-licenses: true
          packages: ""

      - name: Komponenty SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Zależności JS
        run: npm install

      - name: Inicjalizacja projektu Android
        run: npx tauri android init --ci

      # `tauri android build` bez flagi buduje profil release (flaga to `--debug`).
      - name: Budowa APK (release)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk

      # Gradle daje `app-universal-release-unsigned.apk`; bez podpisu nie da się
      # tego zainstalować na telefonie. Podpisujemy stałym kluczem z repo,
      # żeby kolejne wersje dały się instalować nakładkowo.
      - name: Podpisanie APK
        run: |
          set -euo pipefail
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          echo "Niezpodpisany APK: $UNSIGNED"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" launcher-aligned.apk
          "$BT/apksigner" sign \
            --ks src-tauri/android-release.jks \
            --ks-key-alias ogulniega \
            --ks-pass pass:ogulniega \
            --key-pass pass:ogulniega \
            --out ogulniega-full-launcher.apk \
            launcher-aligned.apk
          "$BT/apksigner" verify --print-certs ogulniega-full-launcher.apk
          ls -lh ogulniega-full-launcher.apk

      - name: Artefakt APK
        uses: actions/upload-artifact@v4
        with:
          name: ogulniega-mobile-rust-apk
          path: ogulniega-full-launcher.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Lista paczek
        run: find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' \)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
