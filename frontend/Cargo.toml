[package]
name = "ogulniega-frontend"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "UI Ogulniega Full Launcher — czysty Rust (WASM), bez ręcznego JavaScript"
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "HtmlElement", "Event", "KeyboardEvent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }

# wasm-opt: mniejszy binarny rozmiar i szybsze ładowanie w WebView
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
