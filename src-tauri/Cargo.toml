[package]
name = "ogulniega-full-launcher"
version = "1.0.0"
description = "Pelny launcher Minecraft (Java/Fabric) w Rust dla Android — lista wersji, pobieranie modow z Ogulniegi"
authors = ["xpokrzywa"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ogulniega_full_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
